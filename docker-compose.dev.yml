# AgentForge — local development stack.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Brings up:
#   - firestore : Firestore emulator (no GCP credentials / billing needed)
#   - backend   : FastAPI core API with hot reload, wired to the emulator
#   - frontend  : React + Vite dev server, proxying /api -> backend
#
# This complements the Dev Container (.devcontainer/): the Dev Container gives you
# an identical *tooling* shell; this compose stack runs the whole *app* locally.
services:
  firestore:
    image: google/cloud-sdk:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=agentforge-498808
    ports:
      - "8081:8080" # host 8081 -> emulator 8080 (keeps host 8080 free for backend)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8080" # host 8000 -> container 8080 (host 8080 is taken by WSL relay)
    environment:
      GOOGLE_CLOUD_PROJECT: agentforge-498808
      GOOGLE_CLOUD_REGION: asia-northeast1
      FIRESTORE_EMULATOR_HOST: firestore:8080
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # LLM Provider Gateway (§2.6): demo default = codex via host bridge.
      # Needs the host bridge running:  python scripts/codex_bridge.py
      # Force another provider here if needed: LLM_PROVIDER=stub | gemini | claude-cli
      APP_ENV: local
      LLM_PROVIDER: codex
      CODEX_BRIDGE_URL: http://host.docker.internal:8766/generate
      CODEX_FLASH_MODEL: gpt-5.5
      CODEX_PRO_MODEL: gpt-5.5
      CLAUDE_BRIDGE_URL: http://host.docker.internal:8765/generate
      # Capability tiers (canonical): PRO = Opus (matches Gemini Pro — code
      # generation quality), FLASH = Haiku (matches Gemini Flash — light steps).
      # Opus is slower for full-app generation, but the timeout is generous (600s)
      # and the user controls waiting (②もう少し待つ), so we use the proper tier.
      CLAUDE_PRO_MODEL: opus
      # FLASH: haiku proved too weak in practice (fabricated status text,
      # weak classification) vs Gemini Flash's band — raise dev FLASH to sonnet.
      CLAUDE_FLASH_MODEL: sonnet
      # LLM_PROVIDER: stub   # uncomment to run fully offline without the bridge
    # Optional: drop GEMINI_API_KEY=... into backend/.env (gitignored) to test
    # real Gemini locally. Absent -> deterministic stub when provider can't reach LLM.
    env_file:
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach host LLM bridges (Linux parity)
    volumes:
      - ./backend/app:/app/app:cached # live reload on host edits
    depends_on:
      firestore:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Vite dev server proxies /api to the backend service (see vite.config.ts).
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules # keep container-installed deps, don't shadow with host
    depends_on:
      - backend

  # SEPARATE admin app on its own port (admin.html). Not linked from the user app.
  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--port", "5174", "--host"]
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    depends_on:
      - backend
