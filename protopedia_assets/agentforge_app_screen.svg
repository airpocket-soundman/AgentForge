<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AgentForge app screen structure</title>
  <desc id="desc">Screen structure diagram for AgentForge showing menu, mini-app area, app chat, main chat, and generated app sandbox.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}
      .shell{fill:#ffffff;stroke:#d8deea;stroke-width:3}
      .menu{fill:#eef3ff;stroke:#aac0ef;stroke-width:2}
      .app{fill:#f6fbf7;stroke:#9cd1ab;stroke-width:2}
      .chat{fill:#fff8e8;stroke:#e8c36e;stroke-width:2}
      .fixed{fill:#fff;stroke:#d8deea;stroke-width:2}
      .overlay{fill:#282f3d;stroke:#111827;stroke-width:2}
      .title{font:700 34px Arial, sans-serif;fill:#172033}
      .h{font:700 22px Arial, sans-serif;fill:#172033}
      .t{font:500 16px Arial, sans-serif;fill:#344053}
      .s{font:400 14px Arial, sans-serif;fill:#5a6678}
      .white{font:700 14px Arial, sans-serif;fill:#fff}
      .arrow{stroke:#657084;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#657084"/>
    </marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="70" class="title">AgentForge アプリ画面構造</text>
  <text x="70" y="106" class="s">生成アプリ本体とメインアプリの操作を分離し、ユーザーは「使う場所」でそのまま作成・改変を依頼できる。</text>

  <rect x="70" y="150" width="1460" height="760" rx="26" class="shell"/>
  <rect x="105" y="190" width="255" height="680" rx="18" class="menu"/>
  <text x="135" y="232" class="h">トップメニュー</text>
  <rect x="135" y="270" width="195" height="46" rx="10" class="fixed"/>
  <text x="158" y="299" class="t">メインチャット</text>
  <rect x="135" y="336" width="195" height="46" rx="10" class="fixed"/>
  <text x="158" y="365" class="t">テトリス</text>
  <rect x="135" y="402" width="195" height="46" rx="10" class="fixed"/>
  <text x="158" y="431" class="t">電卓</text>
  <rect x="135" y="468" width="195" height="46" rx="10" class="fixed"/>
  <text x="158" y="497" class="t">変更履歴</text>
  <rect x="135" y="534" width="195" height="46" rx="10" class="fixed"/>
  <text x="158" y="563" class="t">ステータス</text>
  <rect x="135" y="600" width="195" height="46" rx="10" fill="#2f6fed"/>
  <text x="158" y="629" class="white">アプリ全画面化</text>
  <text x="135" y="690" class="s">メインアプリ側の固定機能。</text>
  <text x="135" y="714" class="s">生成HTMLには埋め込まない。</text>

  <rect x="405" y="190" width="1085" height="455" rx="18" class="app"/>
  <text x="440" y="232" class="h">ミニアプリ表示領域</text>
  <text x="440" y="263" class="s">ここにAIが生成した単一HTMLアプリを sandbox iframe として表示</text>
  <rect x="450" y="300" width="500" height="280" rx="16" class="fixed"/>
  <text x="485" y="344" class="h">生成ミニアプリ</text>
  <text x="485" y="382" class="t">例: テトリス、電卓、タスク管理</text>
  <text x="485" y="418" class="s">外部通信なし / localStorageなし</text>
  <text x="485" y="442" class="s">状態は AF.load / AF.save でサーバ保存</text>
  <rect x="1020" y="300" width="410" height="280" rx="16" class="fixed"/>
  <text x="1055" y="344" class="h">メインアプリの制御</text>
  <text x="1055" y="382" class="t">プレビュー / 承認 / 巻き戻し</text>
  <text x="1055" y="418" class="s">生成アプリの中には入れず、</text>
  <text x="1055" y="442" class="s">シェル側の機能として扱う。</text>

  <rect x="405" y="675" width="1085" height="195" rx="18" class="chat"/>
  <text x="440" y="717" class="h">アプリチャット</text>
  <text x="440" y="750" class="s">各ミニアプリ専属の Specialist Worker と会話。アプリ内データや表示を操作する。</text>
  <rect x="440" y="785" width="785" height="50" rx="12" class="fixed"/>
  <text x="462" y="817" class="s">例: 「スコア表示を大きくして」「タスクを期限順に並べて」</text>
  <rect x="1245" y="785" width="180" height="50" rx="12" fill="#2f6fed"/>
  <text x="1306" y="817" class="white">送信</text>

  <rect x="1265" y="218" width="170" height="44" rx="22" class="overlay"/>
  <text x="1290" y="246" class="white">元に戻す</text>
  <path d="M1350 262 C1350 275 1350 285 1350 300" class="arrow"/>
  <text x="1135" y="238" class="s">全画面中はドラッグ可能な</text>
  <text x="1135" y="260" class="s">シェル側ボタンを重ねる</text>

  <path d="M360 625 C390 625 390 418 405 418" class="arrow"/>
  <path d="M950 580 C950 625 950 650 950 675" class="arrow"/>
</svg>
