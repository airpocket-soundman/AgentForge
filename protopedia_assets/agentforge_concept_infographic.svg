<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AgentForge concept infographic</title>
  <desc id="desc">Friendly infographic explaining AgentForge: users talk to the app, AI workers safely run DevOps, and mini apps grow inside the app.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf6}
      .card{fill:#fff;stroke:#e2dfd5;stroke-width:2}
      .soft-blue{fill:#eef5ff;stroke:#aac8f5;stroke-width:2}
      .soft-green{fill:#eef9f1;stroke:#9cd7ac;stroke-width:2}
      .soft-yellow{fill:#fff7df;stroke:#e8c76f;stroke-width:2}
      .soft-pink{fill:#fff0f3;stroke:#eba2b2;stroke-width:2}
      .soft-purple{fill:#f3efff;stroke:#c4b5fd;stroke-width:2}
      .title{font:800 42px Arial, sans-serif;fill:#172033}
      .subtitle{font:500 20px Arial, sans-serif;fill:#465066}
      .h{font:800 25px Arial, sans-serif;fill:#172033}
      .t{font:600 18px Arial, sans-serif;fill:#283246}
      .s{font:400 15px Arial, sans-serif;fill:#5b6678}
      .tiny{font:700 13px Arial, sans-serif;fill:#6b7280}
      .white{font:800 16px Arial, sans-serif;fill:#fff}
      .bubble{fill:#4f46e5}
      .arrow{stroke:#697386;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .arrow-green{stroke:#1f9d55;stroke-width:4;fill:none;marker-end:url(#arrowGreen)}
      .dash{stroke:#697386;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#697386"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#1f9d55"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text x="80" y="82" class="title">AgentForge は「話すだけで育つアプリ」</text>
  <text x="80" y="122" class="subtitle">ユーザーはお願いするだけ。AIワーカーたちが裏側で設計・実装・確認・公開準備を進めます。</text>

  <!-- User card -->
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="330" height="250" rx="28" class="soft-blue"/>
  </g>
  <circle cx="150" cy="270" r="42" fill="#4f46e5"/>
  <circle cx="136" cy="258" r="8" fill="#fff"/>
  <circle cx="164" cy="258" r="8" fill="#fff"/>
  <path d="M132 286 Q150 304 168 286" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="215" y="263" class="h">ユーザー</text>
  <text x="215" y="296" class="s">作りたいものを</text>
  <text x="215" y="320" class="s">自然な言葉で伝える</text>
  <rect x="112" y="360" width="266" height="52" rx="18" fill="#fff" stroke="#ccd7f0"/>
  <text x="137" y="392" class="t">「テトリス作って」</text>

  <!-- Main chat card -->
  <g filter="url(#shadow)">
    <rect x="520" y="165" width="460" height="300" rx="30" class="card"/>
  </g>
  <text x="560" y="215" class="h">メインチャットが受付</text>
  <text x="560" y="250" class="s">あいまいな依頼を確認して、作る内容を整理します。</text>
  <rect x="560" y="285" width="380" height="58" rx="18" fill="#f4f6fb" stroke="#dde3ee"/>
  <text x="586" y="320" class="t">1. 内容を復唱</text>
  <rect x="560" y="360" width="380" height="58" rx="18" fill="#fff7df" stroke="#e8c76f"/>
  <text x="586" y="395" class="t">2. 「お願い」で制作へ</text>

  <!-- Workers ring -->
  <g filter="url(#shadow)">
    <rect x="1090" y="145" width="430" height="350" rx="34" class="soft-green"/>
  </g>
  <text x="1130" y="198" class="h">AIワーカーたち</text>
  <text x="1130" y="230" class="s">役割を分けて、安全にDevOpsを回します。</text>
  <rect x="1130" y="265" width="150" height="54" rx="18" fill="#fff" stroke="#b7dec1"/>
  <text x="1158" y="298" class="t">設計</text>
  <rect x="1320" y="265" width="150" height="54" rx="18" fill="#fff" stroke="#b7dec1"/>
  <text x="1348" y="298" class="t">生成</text>
  <rect x="1130" y="350" width="150" height="54" rx="18" fill="#fff" stroke="#b7dec1"/>
  <text x="1158" y="383" class="t">検証</text>
  <rect x="1320" y="350" width="150" height="54" rx="18" fill="#fff" stroke="#b7dec1"/>
  <text x="1348" y="383" class="t">レビュー</text>
  <rect x="1230" y="425" width="160" height="44" rx="22" fill="#1f9d55"/>
  <text x="1264" y="453" class="white">公開準備</text>

  <path d="M410 315 C455 315 475 315 520 315" class="arrow"/>
  <path d="M980 315 C1025 315 1045 315 1090 315" class="arrow"/>

  <!-- Mini apps area -->
  <g filter="url(#shadow)">
    <rect x="145" y="570" width="520" height="315" rx="34" class="soft-purple"/>
  </g>
  <text x="190" y="625" class="h">ミニアプリが増える</text>
  <text x="190" y="657" class="s">作った機能は AgentForge の中に追加されます。</text>
  <rect x="190" y="705" width="130" height="120" rx="22" fill="#fff" stroke="#c4b5fd"/>
  <text x="222" y="750" class="t">電卓</text>
  <text x="223" y="782" class="s">計算する</text>
  <rect x="345" y="705" width="130" height="120" rx="22" fill="#fff" stroke="#c4b5fd"/>
  <text x="377" y="750" class="t">テトリス</text>
  <text x="377" y="782" class="s">遊べる</text>
  <rect x="500" y="705" width="130" height="120" rx="22" fill="#fff" stroke="#c4b5fd"/>
  <text x="527" y="750" class="t">メモ</text>
  <text x="524" y="782" class="s">保存する</text>

  <!-- Safety -->
  <g filter="url(#shadow)">
    <rect x="780" y="570" width="350" height="315" rx="34" class="soft-yellow"/>
  </g>
  <text x="825" y="625" class="h">勝手に公開しない</text>
  <text x="825" y="658" class="s">人間の承認が入るので、安心して任せられます。</text>
  <rect x="825" y="700" width="260" height="46" rx="18" fill="#fff" stroke="#e8c76f"/>
  <text x="850" y="730" class="t">お願い</text>
  <rect x="825" y="760" width="260" height="46" rx="18" fill="#fff" stroke="#e8c76f"/>
  <text x="850" y="790" class="t">これで作って</text>
  <rect x="825" y="820" width="260" height="46" rx="18" fill="#fff" stroke="#e8c76f"/>
  <text x="850" y="850" class="t">反映して</text>

  <!-- Specialist worker -->
  <g filter="url(#shadow)">
    <rect x="1245" y="570" width="275" height="315" rx="34" class="soft-pink"/>
  </g>
  <text x="1283" y="625" class="h">作った後も相談</text>
  <text x="1283" y="658" class="s">各ミニアプリに専属の</text>
  <text x="1283" y="682" class="s">Specialist Worker が付きます。</text>
  <rect x="1285" y="725" width="195" height="62" rx="22" fill="#fff" stroke="#eba2b2"/>
  <text x="1305" y="762" class="t">「色を変えて」</text>
  <rect x="1285" y="810" width="195" height="62" rx="22" fill="#fff" stroke="#eba2b2"/>
  <text x="1305" y="847" class="t">「状態を保存」</text>

  <path d="M1305 495 C1305 530 1385 530 1385 570" class="arrow-green"/>
  <path d="M1110 495 C1040 535 940 535 940 570" class="dash"/>
  <path d="M735 465 C655 520 505 520 405 570" class="arrow-green"/>

  <!-- Bottom message -->
  <rect x="80" y="925" width="1440" height="48" rx="24" fill="#172033"/>
  <text x="165" y="956" class="white">つまり: アプリを探すのではなく、自分の言葉でアプリを育てる。AIは強権限を持たず、承認ゲートの中で安全に働きます。</text>
</svg>
