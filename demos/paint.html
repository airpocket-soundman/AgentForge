<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>お絵描きツール</title>
<style>
  :root {
    --bar: #1f2330;
    --bar2: #2a2f3e;
    --accent: #6366f1;
    --accent2: #818cf8;
    --txt: #e6e8ef;
    --muted: #9aa1b3;
    --line: #3a4054;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; height: 100vh;
    font-family: system-ui, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #0e1016; color: var(--txt); user-select: none;
  }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--bar);
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .label { font-size: 12px; color: var(--muted); margin-right: 2px; }

  button.tool {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--bar2); color: var(--txt);
    padding: 8px 12px; border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: .12s; min-height: 40px;
  }
  button.tool:hover { border-color: var(--accent2); }
  button.tool:active { transform: translateY(1px); }
  button.tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.tool:disabled { opacity: .35; cursor: not-allowed; }

  /* color swatches */
  .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255,255,255,.25); transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  input[type=color] {
    width: 36px; height: 36px; padding: 0; border: none; border-radius: 8px;
    background: none; cursor: pointer;
  }

  /* size */
  input[type=range] { width: 130px; accent-color: var(--accent2); cursor: pointer; }
  .size-val { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 42px; color: var(--muted); }
  .preview-dot { width: 44px; display: grid; place-items: center; }
  .preview-dot span { background: var(--txt); border-radius: 50%; display: block; }

  /* ---- Canvas ---- */
  .stage { position: relative; flex: 1 1 auto; background: #c9ccd6; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; background: #fff; }

  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(20,22,30,.78); color: #cfd3df; padding: 6px 14px;
    border-radius: 20px; font-size: 12px; pointer-events: none; transition: opacity .4s;
  }
  @media (max-width: 720px) { .label { display: none; } input[type=range] { width: 96px; } }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="group">
      <button class="tool active" id="penBtn" title="ペン">✏️ ペン</button>
      <button class="tool" id="eraserBtn" title="消しゴム">🧽 消しゴム</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="label">色</span>
      <div class="swatches" id="swatches"></div>
      <input type="color" id="picker" value="#222222" title="自由な色" />
    </div>

    <div class="sep"></div>

    <div class="group">
      <span class="label">太さ</span>
      <button class="tool" data-size="3" title="細">細</button>
      <button class="tool" data-size="10" title="中">中</button>
      <button class="tool" data-size="24" title="太">太</button>
      <input type="range" id="size" min="1" max="40" value="6" />
      <span class="size-val" id="sizeVal">6 px</span>
      <span class="preview-dot"><span id="dot"></span></span>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button class="tool" id="undoBtn" title="元に戻す (Ctrl+Z)" disabled>↩️ 戻す</button>
      <button class="tool" id="redoBtn" title="やり直し (Ctrl+Y)" disabled>↪️ やり直し</button>
      <button class="tool" id="clearBtn" title="全消去">🗑️ 全消去</button>
      <button class="tool" id="saveBtn" title="PNG保存">💾 保存</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">マウスや指で描けます。色・太さを変えて試してみてください。</div>
  </div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const stage = cv.parentElement;

  // ---- State ----
  let color = '#222222';
  let size = 6;
  let tool = 'pen';            // 'pen' | 'eraser'
  let drawing = false;
  let last = null;
  const undoStack = [];
  const redoStack = [];
  const MAX_HISTORY = 40;

  // ---- High-DPI canvas sizing (preserves drawing on resize) ----
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = stage.clientWidth, h = stage.clientHeight;
    const prev = (cv.width && cv.height) ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // white background fill so eraser & saved PNG are white, not transparent
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    if (prev) ctx.putImageData(prev, 0, 0);
    ctx.restore();
  }

  // ---- History ----
  function snapshot() {
    try { return ctx.getImageData(0, 0, cv.width, cv.height); } catch { return null; }
  }
  function pushUndo() {
    const s = snapshot(); if (!s) return;
    undoStack.push(s);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    syncHistoryButtons();
  }
  function restore(img) { if (img) { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.putImageData(img, 0, 0); ctx.restore(); } }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
    syncHistoryButtons();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    syncHistoryButtons();
  }
  function syncHistoryButtons() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
    document.getElementById('redoBtn').disabled = redoStack.length === 0;
  }

  // ---- Pointer / drawing ----
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function strokeTo(p) {
    ctx.strokeStyle = (tool === 'eraser') ? '#ffffff' : color;
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    // quadratic smoothing via midpoint -> no jagged corners at speed
    const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
    ctx.quadraticCurveTo(last.x, last.y, mx, my);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    pushUndo();
    last = pos(e);
    // dot for a single tap/click
    ctx.fillStyle = (tool === 'eraser') ? '#ffffff' : color;
    ctx.beginPath(); ctx.arc(last.x, last.y, size / 2, 0, Math.PI * 2); ctx.fill();
    hideHint();
  }
  function move(e) { if (drawing) { e.preventDefault(); strokeTo(pos(e)); } }
  function end() { drawing = false; last = null; }

  cv.addEventListener('pointerdown', start);
  cv.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  cv.addEventListener('pointerleave', () => { if (drawing) last = pos; });

  // ---- UI: tools ----
  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  function setTool(t) {
    tool = t;
    penBtn.classList.toggle('active', t === 'pen');
    eraserBtn.classList.toggle('active', t === 'eraser');
    cv.style.cursor = t === 'eraser' ? 'cell' : 'crosshair';
  }
  penBtn.onclick = () => setTool('pen');
  eraserBtn.onclick = () => setTool('eraser');

  // ---- UI: palette ----
  const COLORS = ['#222222','#ffffff','#ef4444','#f97316','#f59e0b','#eab308',
                  '#22c55e','#10b981','#06b6d4','#3b82f6','#6366f1','#a855f7',
                  '#ec4899','#92400e','#78716c','#94a3b8'];
  const swEl = document.getElementById('swatches');
  const picker = document.getElementById('picker');
  function setColor(c, fromPicker) {
    color = c; setTool('pen');
    [...swEl.children].forEach(s => s.classList.toggle('active', s.dataset.c === c));
    if (!fromPicker) picker.value = c;
  }
  COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'swatch' + (i === 0 ? ' active' : '');
    d.style.background = c; d.dataset.c = c;
    if (c === '#ffffff') d.style.borderColor = '#bbb';
    d.onclick = () => setColor(c, false);
    swEl.appendChild(d);
  });
  picker.oninput = () => setColor(picker.value, true);

  // ---- UI: size ----
  const sizeEl = document.getElementById('size');
  const sizeVal = document.getElementById('sizeVal');
  const dot = document.getElementById('dot');
  function setSize(v) {
    size = Math.max(1, Math.min(40, v|0));
    sizeEl.value = size;
    sizeVal.textContent = size + ' px';
    const d = Math.max(3, Math.min(30, size));
    dot.style.width = d + 'px'; dot.style.height = d + 'px';
  }
  sizeEl.oninput = () => setSize(+sizeEl.value);
  document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => setSize(+b.dataset.size));

  // ---- UI: actions ----
  document.getElementById('undoBtn').onclick = undo;
  document.getElementById('redoBtn').onclick = redo;
  document.getElementById('clearBtn').onclick = () => {
    pushUndo();
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();
  };
  document.getElementById('saveBtn').onclick = () => {
    const a = document.createElement('a');
    a.download = 'drawing.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  // ---- Keyboard ----
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (e.key === '[') setSize(size - 1);
    else if (e.key === ']') setSize(size + 1);
    else if (e.key.toLowerCase() === 'e') setTool('eraser');
    else if (e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'p') setTool('pen');
  });

  // ---- Hint auto-hide ----
  let hintTimer;
  function hideHint() {
    const h = document.getElementById('hint');
    h.style.opacity = '0';
  }
  hintTimer = setTimeout(hideHint, 5000);

  // ---- Init ----
  window.addEventListener('resize', resize);
  resize();
  setSize(6);
  syncHistoryButtons();
})();
</script>
</body>
</html>
